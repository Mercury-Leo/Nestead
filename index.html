<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nestead</title>
    <!-- Installable on a phone's home screen. The theme colours are --paper in
         each theme (styles/tokens.css); icons are drawn from public/icons/icon.svg. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nestead" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Set the theme before first paint so a dark-mode page never flashes
      // light. ThemeProvider (src/components/theme.tsx) takes over from here;
      // the key is the device preference it writes through data/localStore.ts.
      (function () {
        var choice = 'system';
        try {
          choice = JSON.parse(localStorage.getItem('nestead:device:pref:theme')) || 'system';
        } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
      // Language and direction the same way, so a right-to-left page never lays
      // out left-to-right first. LocaleProvider (src/i18n/LocaleProvider.tsx) takes
      // over and corrects an unsupported code; i18n.test.ts checks the two agree.
      (function () {
        var locale = 'en';
        try {
          locale = JSON.parse(localStorage.getItem('nestead:device:pref:locale')) || 'en';
        } catch (e) {}
        if (typeof locale !== 'string') locale = 'en';
        var rtl = /^(ar|he|fa|ur|ps|yi|dv|ckb)(-|$)/i.test(locale);
        document.documentElement.lang = locale;
        document.documentElement.dir = rtl ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

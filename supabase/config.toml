# Supabase CLI project config.
#
# This file deliberately declares almost nothing. `supabase config push` writes
# every property the file declares and leaves the rest alone, so a file full of
# `supabase init` template defaults will happily overwrite real settings: the
# generated version of this file would have disabled email confirmation, turned
# off MFA and SMS auth, shortened OTPs and removed email rate limiting, none of
# which anyone chose.
#
# So: declare a setting here only when we mean to own it. Everything else stays
# whatever the dashboard says. The local development stack is not configured
# because it needs Docker and we do not use it; migrations run against the
# linked project with `supabase db push`.

project_id = "nestead"

[auth]
# Where confirmation and recovery links send people. Must be the deployed app,
# not localhost, or a real sign-up emails you a link to your own laptop.
site_url = "https://nestead.pages.dev"
